version: 1
display_name: Codex TDD Devflow
short_description: 面向陌生团队的语义驱动 API 开发状态机
default_prompt: >-
  运行 codex-tdd-devflow。先走 INTRO：执行
  python3 codex_skills/codex-tdd-devflow/scripts/workflow_runner.py detect-preset，
  识别项目更像 django、fastapi 还是 generic，并先向用户确认是否按该预设初始化。
  用户确认后，再执行 init 或 init --preset xxx。
  然后只告诉用户需要修改的配置文件：
  <scaffold-dir>/config/static_controls.json、<scaffold-dir>/workflow_spec.json、
  <scaffold-dir>/config/project_rules.json。用户回复“配置完了”后，再执行
  python3 codex_skills/codex-tdd-devflow/scripts/workflow_runner.py check-config，并继续阅读
  overview/business 与当前代码完成语义审核。只有 check-config.status=ready，
  且 semantic_review.status=ready，并且当前 session 语义审核通过，才进入 run-auto；否则只返回阻断项。
  init 产出的模板会带有 _template / _comment / _examples 中文说明；先替换 __CODEX_DEVFLOW_REQUIRED_*__ 占位值。
  如果开始 run-auto，推进到第一个 gate，只输出简洁阶段摘要；只有在需要完整原始载荷时才追加 --json。
  如果当前目录不是仓库根目录，追加 --workspace /path/to/repo；如果想改运行时目录名，追加
  --scaffold-dir your_scaffold_dir。若 api_registry 为空且 bootstrap_done=false，
  按 bootstrap 首轮纳管理解。session_api_candidates.jsonl 与 session_case_candidates.jsonl
  默认由当前 Codex session 生成和刷新，属于会话产物，不是项目配置文件。
  status 与 gate 默认会返回压缩后的 config_readiness brief；其中 ready 只表示结构 ready，不表示可以跳过语义审核。
  需要完整 config_readiness 原始载荷时，使用 status --json、gate --json 或 check-config。
  进入 waiting_decision 后，先用 gate 查看摘要，再用 decide
  --approve/--reject/--goto-stage --apply 处理门禁。
