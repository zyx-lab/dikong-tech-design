<!DOCTYPE html>
<html>
  <head>
    {% block head %}
    <title>{{ title|default:"Swagger" }}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if favicon_href %}<link rel="icon" href="{{ favicon_href }}">{% endif %}
    <link rel="stylesheet" href="{{ swagger_ui_css }}">
    <style>
      html { box-sizing: border-box; overflow-y: scroll; }
      *, *:after, *:before { box-sizing: inherit; }
      body { background: #fafafa; margin: 0; }

      #auth-status-banner {
        position: sticky;
        top: 0;
        z-index: 9999;
        padding: 10px 16px;
        font-size: 14px;
        border-bottom: 1px solid #d9d9d9;
        background: #fff8e1;
        color: #5d4037;
      }

      #auth-status-banner.ok {
        background: #e8f5e9;
        color: #1b5e20;
      }

      #auth-status-banner.warn {
        background: #fff8e1;
        color: #5d4037;
      }
    </style>
    {% endblock head %}
  </head>
  <body>
    {% block body %}
    <div id="auth-status-banner" class="warn">正在检测登录状态...</div>
    <div id="swagger-ui"></div>
    <script src="{{ swagger_ui_bundle }}"></script>
    <script src="{{ swagger_ui_standalone }}"></script>
    {% if script_url %}
    <script src="{{ script_url }}"></script>
    {% else %}
    <script>
    {% include template_name_js %}
    </script>
    {% endif %}
    <script>
      (function () {
        var banner = document.getElementById('auth-status-banner');
        var pathname = window.location.pathname || '';

        function setBanner(text, cls) {
          banner.textContent = text;
          banner.className = cls;
        }

        if (pathname.startsWith('/docs/')) {
          setBanner('当前为统一 OpenAPI 文档页。当前仓库正式接口统一收口到 /api/v1/*；导入 Apifox 请使用 /docs/schema/。', 'warn');
          return;
        }

        if (pathname.startsWith('/internal/docs/')) {
          setBanner('当前为内部文档页。若页面无接口，表示当前仓库没有额外暴露内部 HTTP API。', 'warn');
          return;
        }

        setBanner('当前为 /api/v1 业务文档页。需要认证的接口请在 Swagger Authorize 中填写 Bearer Token；租户工作侧接口还需要传 X-TENANT-CODE。', 'warn');
      })();
    </script>
    {% endblock %}
  </body>
</html>
