services:
  onboarding:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_ENGINE: postgres
      DJANGO_SETTINGS_MODULE: config.settings
      ONBOARDING_CONFIG_WRITABLE: "true"
    volumes:
      - .:/app
    command: python manage.py runserver 0.0.0.0:8080

  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-dikong}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-dikong-route-covers}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 '${MINIO_ROOT_USER:-minioadmin}' '${MINIO_ROOT_PASSWORD:-minioadmin123}' &&
                  mc mb --ignore-existing 'local/${OBJECT_STORAGE_BUCKET_NAME:-dikong-route-covers}'"

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: ${DB_NAME:-dikong}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DJI_INTERNAL_API_TOKEN: ${DJI_INTERNAL_API_TOKEN:-}
      CHANNEL_REDIS_URL: redis://redis:6379/0
      DJI_V2_MQTT_REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-dikong-route-covers}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://192.168.3.99:9000}
      AWS_S3_ADDRESSING_STYLE: path
      AWS_QUERYSTRING_AUTH: "true"
      OBJECT_STORAGE_URL_EXPIRE_SECONDS: 3600
      NO_PROXY: 127.0.0.1,localhost,192.168.3.99,192.168.3.16,minio
      no_proxy: 127.0.0.1,localhost,192.168.3.99,192.168.3.16,minio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py bootstrap_v2_system &&
             python manage.py migrate_route_covers_to_object_storage --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  v2-dji-worker:
    build: .
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: ${DB_NAME:-dikong}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      CHANNEL_REDIS_URL: redis://redis:6379/0
      DJI_V2_MQTT_REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_BACKEND: minio
      OBJECT_STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-dikong-route-covers}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-http://192.168.3.99:9000}
      AWS_S3_ADDRESSING_STYLE: path
      AWS_QUERYSTRING_AUTH: "true"
      OBJECT_STORAGE_URL_EXPIRE_SECONDS: 3600
      NO_PROXY: 127.0.0.1,localhost,192.168.3.99,192.168.3.16,minio
      no_proxy: 127.0.0.1,localhost,192.168.3.99,192.168.3.16,minio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: python manage.py run_v2_dji_worker

volumes:
  pgdata:
  minio-data:
