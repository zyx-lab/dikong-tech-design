version: '3.8'

services:
  db:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: dikong
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: dikong
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
      CHANNEL_REDIS_URL: redis://redis:6379/0
      DJI_V2_MQTT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_role_permissions &&
             python manage.py create_business_admin_account --username biz_root --password admin123 --upsert &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"

  v2-dji-worker:
    build: .
    environment:
      DB_ENGINE: postgres
      DB_HOST: db
      DB_NAME: dikong
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: 5432
      DJANGO_SETTINGS_MODULE: config.settings
      CHANNEL_REDIS_URL: redis://redis:6379/0
      DJI_V2_MQTT_REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: python manage.py run_v2_dji_worker

volumes:
  pgdata:
